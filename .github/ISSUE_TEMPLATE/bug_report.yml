name: Bug report
description: Report reproducible incorrect behavior or a regression.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start the service with...
        2. Open...
        3. Edit...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Go, Node.js, browser, MCP host, and workbook details that are safe to share.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workbook and XLSX
        - Browser UI
        - MCP tools
        - Realtime events
        - Authentication and security
        - Build and deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove workbook contents, credentials, tokens, and personal data.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, bearer tokens, and private workbook data.
          required: true
