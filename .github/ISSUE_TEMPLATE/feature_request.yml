name: Feature request
description: Propose a focused product or engineering improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or system problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true before this issue can close.
      placeholder: |
        - [ ] The user can...
        - [ ] Automated tests prove...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the behavior, boundaries, and files or systems expected to change.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Identify related work that this issue must not absorb.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation or architecture notes.
  - type: textarea
    id: evidence
    attributes:
      label: Verification and evidence
      description: Describe automated checks, manual checks, fixtures, or host evidence required.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Workbook and XLSX
        - Browser UI
        - MCP tools
        - Realtime collaboration
        - Authentication and security
        - Build and deployment
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The proposal works without Univer Pro packages or services.
          required: true
        - label: The proposal keeps MCP tools useful when embedded UI is unavailable.
          required: true
