<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xlsx-viewer</title>
    <script type="module" crossorigin src="/assets/index-BTONXYkG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-pXWBY-ze.css">
  </head>
  <body class="m-0 h-screen overflow-hidden bg-slate-100 text-slate-900 antialiased">
    <div id="app-shell" class="grid h-full grid-rows-[48px_minmax(0,1fr)] overflow-hidden">
      <header class="z-10 flex items-center justify-between gap-4 border-b border-emerald-900 bg-emerald-800 px-3.5 text-emerald-50">
        <div class="flex min-w-0 items-center gap-2.5">
          <span class="grid size-5 grid-cols-3 grid-rows-3 gap-px rounded-[3px] border border-white bg-emerald-100 p-[3px]" aria-hidden="true">
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
          </span>
          <div class="grid min-w-0">
            <strong id="workbook-name" class="overflow-hidden text-sm leading-[18px] text-ellipsis whitespace-nowrap">Opening workbook</strong>
            <span id="revision-status" class="text-[11px] leading-3.5 text-emerald-200">Connecting</span>
          </div>
        </div>
        <div id="ai-presence" class="hidden max-w-[42vw] shrink-0 items-center gap-2 rounded-full border border-violet-300 bg-violet-50 px-2.5 py-1 text-xs text-violet-950" aria-live="polite">
          <span class="size-2 shrink-0 rounded-full bg-violet-600 ring-3 ring-violet-200" aria-hidden="true"></span>
          <span id="ai-presence-text" class="overflow-hidden text-ellipsis whitespace-nowrap">AI is ready</span>
        </div>
      </header>
      <main id="spreadsheet" class="min-h-0 min-w-0" aria-label="Workbook editor"></main>
      <div id="fatal-error" class="fixed inset-x-4 top-16 z-20 hidden max-w-3xl rounded-lg border border-red-200 bg-red-50 px-4 py-3.5 text-red-900 shadow-xl" role="alert"></div>
    </div>
  </body>
</html>
